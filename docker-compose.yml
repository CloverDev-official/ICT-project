services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ict_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ict_db
      DB_USERNAME: ict_user
      DB_PASSWORD: ict_password
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: ict_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ict_db
      MYSQL_USER: ict_user
      MYSQL_PASSWORD: ict_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/var/lib/mysql

volumes:
  db_data:
